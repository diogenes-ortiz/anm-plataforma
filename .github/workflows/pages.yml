# Publicación (BASE-07): main → sitio real; staging → /staging/ (usa la base de PRUEBA).
# Para que funcione: GitHub → Settings → Pages → Source: "GitHub Actions" (una sola vez).
name: Publicar
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: _site }
      - name: Copia de staging (si existe la rama)
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" staging >/dev/null; then
            git clone --depth 1 --branch staging "https://github.com/${{ github.repository }}" _staging
            rm -rf _staging/.git && mv _staging _site/staging
          fi
      - run: rm -rf _site/.git _site/.github _site/tests _site/node_modules
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
