# Integración continua (BASE-06 y BASE-08): corre en cada pull request y en cada push.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main, staging]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sintaxis de los archivos JavaScript
        run: for f in js/*.js; do node --check "$f" || exit 1; done
      - name: Versión actualizada si cambiaron css o js
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(css|js)/'; then
            if ! git diff --name-only "$base" HEAD | grep -qx 'version.json'; then
              echo "::error::Cambiaron archivos de css/ o js/ pero no version.json. Corré: sh tools/bump-version.sh"; exit 1
            fi
          fi
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de humo
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: resultado-pruebas, path: test-results/ }
